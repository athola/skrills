name: Publish Dry Run

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - ".github/workflows/publish-dry-run.yml"
      - ".github/workflows/release.yml"
      - "scripts/publish_crates.sh"

jobs:
  publish-dry-run:
    name: Dry-run cargo publish (all crates)
    runs-on: ubuntu-latest
    # Disable HTTP/2 multiplexing and raise retries: cargo's parallel
    # crates.io downloads intermittently fail with "[16] Error in the
    # HTTP2 framing layer" on the CDN. HTTP/1.1 plus retries is resilient.
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify crate packaging (dry-run)
        run: |
          set -euo pipefail
          scripts/verify_publish_order.sh

          # List files that would be included in the package
          # This validates include/exclude patterns without requiring
          # dependencies to exist on crates.io
          list_pkg() {
            crate="$1"
            echo "::group::cargo package --list -p $crate"
            cargo package -p "$crate" --list --allow-dirty
            echo "::endgroup::"
          }

          # Full package validation (only for crates already on crates.io)
          full_pkg() {
            crate="$1"
            echo "::group::cargo package -p $crate"
            cargo package -p "$crate" --allow-dirty
            echo "::endgroup::"
          }

          # Verify file inclusion for all crates
          echo "=== Verifying package file inclusion ==="
          publish_order="$(scripts/verify_publish_order.sh --print-order)"
          if [[ -z "${publish_order}" ]]; then
            echo "ERROR: No crates in publish order" >&2
            exit 1
          fi
          for crate in ${publish_order}; do
            list_pkg "$crate"
          done

          # Full package validation resolves every dependency from crates.io,
          # so it can only run on crates with no in-workspace dependency:
          # before a release, the workspace version is not published yet.
          # Pick those crates by inspection instead of by a list that goes
          # stale when a crate gains a workspace dependency (discovery gained
          # skrills-validate in 0.9.0).
          echo "=== Full package validation for leaf crates ==="
          leaf_crates="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[]
                | select(.publish == null)
                | select([.dependencies[] | select(.kind != "dev") | select(.path != null)] | length == 0)
                | .name')"
          if [[ -z "${leaf_crates}" ]]; then
            echo "ERROR: no leaf crates found; the jq filter is broken" >&2
            exit 1
          fi
          for crate in ${leaf_crates}; do
            full_pkg "$crate"
          done

          # Verify all crates compile
          echo "=== Verifying compilation ==="
          echo "::group::cargo check --workspace"
          cargo check --workspace
          echo "::endgroup::"

          echo "[OK] All crate packaging checks passed"
