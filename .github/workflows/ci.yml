name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      book: ${{ steps.filter.outputs.book }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - 'build.rs'
              - '.github/actions/validate-skills/**'
              - '.github/workflows/ci.yml'
            book:
              - 'book/**'
              - '.github/workflows/ci.yml'
            # The hygiene lints read crate sources and markdown, and the pytest
            # suite covers the scripts under scripts/, so all three trigger it.
            scripts:
              - 'scripts/**'
              - 'githooks/**'
              - 'tests/unit/**'
              - 'Makefile'
              - 'crates/**'
              - '**/*.md'
              - '.github/workflows/ci.yml'

  lint-and-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolved 2026-10-02
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      # NOTE: Keep flags in sync with Makefile `lint` target
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --no-default-features -- -D warnings
          cargo clippy -p skrills-analyze --all-targets --no-default-features -- -D warnings

      # NOTE: Same command as Makefile `test` with TEST_THREADS unset (cargo's
      # parallel default); shared-state tests are serialized with serial_test.
      - name: Tests (all features)
        run: cargo test --workspace --all-features

  hygiene-and-scripts:
    name: Hygiene lints + script tests
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # lint-prose-slop.sh and lint-rust-decoration.sh exit 2 without ripgrep,
      # lint-shell refuses to run without shellcheck,
      # `make test-scripts` refuses to run without pytest on PATH, and the
      # dogfood slice tests skip themselves without jq.
      - name: Install ripgrep, jq, shellcheck and pytest
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep jq shellcheck
          python -m pip install --upgrade pytest
      # lint-shell diffs every script against shfmt. Pinned to the release
      # developers run, because shfmt minors format differently; the digest is
      # the one GitHub publishes for this release asset.
      - name: Install shfmt 3.13.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shfmt" \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  $RUNNER_TEMP/shfmt" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
      - name: Hygiene lints
        run: make lint-hygiene
      # The pre-commit hook runs markdownlint; without this step a PR from a
      # contributor without the hook merges failures that block everyone else.
      # ubuntu-latest ships Node, so npx is on PATH.
      - name: Markdown lint
        run: make lint-md
      - name: Script test suite
        run: make test-scripts

  dogfood:
    name: Dogfood output contracts
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolved 2026-10-02
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install jq + tmux
        run: sudo apt-get update && sudo apt-get install -y jq tmux
      # install.sh helper-function tests (OS/arch/target detection, asset
      # selection incl. the .sha256 sidecar regression). No build needed.
      - name: install.sh contract tests
        run: ./scripts/test-install.sh
      # The validate JSON output contract drives the real binary through the
      # real validate-skills action entrypoint, so build the release binary.
      # The cli crate's default features include `dashboard`, so the
      # cold-window TUI is compiled in for the PTY scenarios below.
      - name: Build release binary
        run: cargo build --release --bin skrills
      - name: Dogfood output contracts (validate JSON + asset selection)
        run: BIN_PATH=target/release/skrills ./scripts/dogfood-contracts.sh
      # Drive the interactive TUI under a real PTY (tmux) on the headless
      # runner; also covers the no-TTY graceful-refusal contracts.
      - name: Dogfood TUI contracts (PTY via tmux)
        run: BIN_PATH=target/release/skrills ./scripts/dogfood-tui.sh

  docs:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolved 2026-10-02
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo docs
        run: cargo doc --workspace --all-features --no-deps

  mdbook:
    needs: changes
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mdbook
        run: cargo install mdbook --locked
      - name: Build book
        run: mdbook build book

  public-api:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolved 2026-10-02
        with:
          toolchain: stable
      - name: Install nightly toolchain for cargo-public-api
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked
      - name: Fetch master for baseline
        run: git fetch origin master --depth=1
      - name: Public API check (skrills-server)
        run: |
          set -euo pipefail
          git_root="$(git rev-parse --show-toplevel 2>/dev/null || true)"
          if [ -z "$git_root" ] || [ ! -d "$git_root/.git" ]; then
            echo "Skipping public API check: git metadata unavailable";
            exit 0;
          fi
          cd "$git_root/crates/server"
          export GIT_DIR="$git_root/.git"
          export GIT_WORK_TREE="$git_root"
          if ! cargo +nightly public-api diff --deny removed --deny changed origin/master..HEAD; then
            echo "::warning::Public API diff detected changes or tool failure; review manually"
          fi

  release-build-check:
    name: Release build (dry run)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain_targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
            build_tool: cross
            target_list: |
              x86_64-unknown-linux-gnu
              aarch64-unknown-linux-gnu
          - os: macos-14
            toolchain_targets: x86_64-apple-darwin,aarch64-apple-darwin
            build_tool: cargo
            target_list: |
              x86_64-apple-darwin
              aarch64-apple-darwin
          - os: windows-latest
            toolchain_targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
            build_tool: cargo
            target_list: |
              x86_64-pc-windows-msvc
              aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolved 2026-10-02
        with:
          toolchain: stable
          targets: ${{ matrix.toolchain_targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cross (Linux only)
        if: matrix.build_tool == 'cross'
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cross
      - name: Build release binaries (no upload)
        shell: bash
        run: |
          set -euo pipefail
          cmd="cargo"
          if [ "${{ matrix.build_tool }}" = "cross" ]; then
            cmd="cross"
          fi
          while IFS= read -r target; do
            [ -z "$target" ] && continue
            echo "Building target $target with $cmd"
            $cmd build --release --bin skrills --target "$target"
          done <<< "${{ matrix.target_list }}"
