[workspace]
members = [
    "crates/discovery",
    "crates/state",
    "crates/server",
    "crates/cli",
    "crates/sync",
    "crates/subagents",
    "crates/validate",
    "crates/analyze",
    "crates/intelligence",
    "crates/metrics",
    "crates/dashboard",
    "crates/test-utils",
    "crates/tome",
    "crates/snapshot",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# rmcp >=1.4 closes RUSTSEC-2026-0189 (DNS rebinding in the Streamable HTTP
# server transport). Since 1.x the model types are #[non_exhaustive], so they
# are built through constructors rather than struct literals. 3.x follows the
# 2026-07-28 MCP spec: `Content` is `ContentBlock`, and `call_tool` /
# `read_resource` return `CallToolResponse` / `ReadResourceResponse`.
rmcp = { version = "3.4", features = ["server", "transport-io", "transport-streamable-http-server", "tower"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util"] }
walkdir = "2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"], default-features = false }
sha2 = "0.11"
blake2 = "0.11"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
pathdiff = "0.2"
dirs = "7"
libc = "0.2"
inquire = "0.9"
tempfile = "3.11"
toml = "1"
semver = "1"
flate2 = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "local-offset", "parsing", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "gzip", "rustls", "query"] }
rayon = "1.10"
parking_lot = "0.12"
subtle = "2.6"
num_cpus = "1"
ratatui = "0.30"
