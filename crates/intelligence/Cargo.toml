[package]
name = "skrills-intelligence"
version = "0.9.0"
edition = "2021"
description = "Intelligent skill recommendations based on usage patterns and project context."
license = "MIT"
repository = "https://github.com/athola/skrills"
homepage = "https://github.com/athola/skrills"
documentation = "https://athola.github.io/skrills/"
readme = "README.md"
keywords = ["mcp", "skills", "recommendations", "analytics", "ai"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "fs", "time"] }
reqwest = { workspace = true, features = ["json"] }
walkdir.workspace = true
toml.workspace = true
dirs.workspace = true
tracing.workspace = true
skrills-snapshot = { path = "../snapshot", version = "0.9.0" }

# Additional dependencies for intelligence features
chrono = { version = "0.4", features = ["serde"] }
trigram = "0.4"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
serial_test = "4"
proptest = "1.4"
skrills_test_utils = { path = "../test-utils" }

# The crate deprecates some of its own public items for downstream users
# (IN-16); its own definitions, re-exports and tests still use them. Inline
# per-site suppressions are blocked by the project's lint-suppression hook, so
# the lint is turned off here. Downstream crates still see the deprecations.
[lints.rust]
deprecated = "allow"
