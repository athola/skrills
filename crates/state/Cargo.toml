[package]
name = "skrills-state"
version = "0.9.1"
edition = "2021"
rust-version.workspace = true
description = "Environment, manifest and runtime-override configuration for skrills, with a validation result cache."
license = "MIT"
repository = "https://github.com/athola/skrills"
homepage = "https://github.com/athola/skrills"
documentation = "https://athola.github.io/skrills/"
readme = "README.md"
keywords = ["mcp", "skills", "state", "config", "runtime"]
categories = ["development-tools", "config"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
sha2.workspace = true
hex = "0.4.3"

[dev-dependencies]
tempfile.workspace = true
skrills-test-utils = { path = "../test-utils" }
