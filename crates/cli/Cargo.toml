[package]
name = "skrills"
version = "0.8.2"
edition = "2021"
description = "A command-line interface and MCP server for managing local SKILL.md files."
license = "MIT"
repository = "https://github.com/athola/skrills"
homepage = "https://github.com/athola/skrills"
documentation = "https://athola.github.io/skrills/"
readme = "README.md"
keywords = ["mcp", "cli", "skills", "agents", "codex"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Ship CLI with subagents and HTTP transport enabled by default.
# Required so release binaries from GitHub have full functionality.
default = ["subagents", "http-transport"]
subagents = ["skrills-server/subagents", "dep:skrills-subagents"]
http-transport = ["skrills-server/http-transport", "dep:rcgen", "dep:x509-parser", "dep:axum"]
dashboard = ["skrills-server/dashboard", "dep:skrills-dashboard"]
watch = ["skrills-server/watch", "dep:notify"]

[dependencies]
skrills-server = { path = "../server", version = "0.8.2" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true
dirs.workspace = true
inquire.workspace = true
tempfile.workspace = true
toml.workspace = true
time.workspace = true
sha2.workspace = true
pathdiff.workspace = true
parking_lot.workspace = true
base64.workspace = true
rmcp.workspace = true
shellexpand = "3"
regex = "1"
hex = "0.4.3"
indexmap = "2.13.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
skrills-snapshot = { path = "../snapshot", version = "0.8.2" }
skrills-discovery = { path = "../discovery", version = "0.8.2" }
skrills-state = { path = "../state", version = "0.8.2" }
skrills_sync = { path = "../sync", version = "0.8.2" }
skrills-validate = { path = "../validate", version = "0.8.2" }
skrills-analyze = { path = "../analyze", version = "0.8.2" }
skrills-intelligence = { path = "../intelligence", version = "0.8.2" }
skrills-metrics = { path = "../metrics", version = "0.8.2" }
skrills-tome = { path = "../tome", version = "0.8.2" }
skrills-subagents = { path = "../subagents", version = "0.8.2", optional = true }
skrills-dashboard = { path = "../dashboard", version = "0.8.2", optional = true }
notify = { version = "8", optional = true }
rcgen = { version = "0.14", optional = true }
x509-parser = { version = "0.18", optional = true }
axum = { version = "0.8", optional = true }

[dev-dependencies]
tempfile.workspace = true
scopeguard = "1.2"
skrills_test_utils = { path = "../test-utils" }
