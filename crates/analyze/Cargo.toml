[package]
name = "skrills-analyze"
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
description = "Skill analysis: token counting, dependencies, and optimization"
license = "MIT"
repository = "https://github.com/athola/skrills"
homepage = "https://github.com/athola/skrills"
documentation = "https://athola.github.io/skrills/"
readme = "../../README.md"
keywords = ["mcp", "skills", "analysis", "tokens", "optimization"]
categories = ["development-tools"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
walkdir = { workspace = true }
thiserror = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
skrills-validate = { path = "../validate", version = "0.9.1" }
skrills-discovery = { path = "../discovery", version = "0.9.1" }
skrills-snapshot = { path = "../snapshot", version = "0.9.1" }
skrills-intelligence = { path = "../intelligence", version = "0.9.1", optional = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
num_cpus = { workspace = true }
toml = { workspace = true }

[features]
# The cold-window hint scorer from skrills-intelligence (ADR 0010). Token
# counting alone builds without it.
default = ["intelligence-scorer"]
intelligence-scorer = ["dep:skrills-intelligence"]

[dev-dependencies]
tempfile = { workspace = true }
skrills-test-utils = { path = "../test-utils" }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "tick_budget"
harness = false

# The crate deprecates some of its own public items for downstream users
# (IN-75); its own definitions, re-exports and tests still use them. Inline
# per-site suppressions are blocked by the project's lint-suppression hook, so
# the lint is turned off here. Downstream crates still see the deprecations.
[lints.rust]
deprecated = "allow"
