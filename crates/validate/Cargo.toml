[package]
name = "skrills-validate"
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
description = "Skill validation for Claude Code and Codex CLI"
license = "MIT"
repository = "https://github.com/athola/skrills"
homepage = "https://github.com/athola/skrills"
documentation = "https://athola.github.io/skrills/"
readme = "../../README.md"
keywords = ["mcp", "skills", "validation", "linting", "cli"]
categories = ["development-tools"]

[dependencies]
serde = { workspace = true }
serde_norway = { workspace = true }
regex = "1"
anyhow = { workspace = true }
walkdir = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }
notify = { version = "8", optional = true }
libc = { workspace = true, optional = true }

[features]
default = []
watch = ["notify", "libc"]

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.4"
skrills-test-utils = { path = "../test-utils" }
