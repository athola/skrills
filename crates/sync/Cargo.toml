[package]
name = "skrills_sync"
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
description = "Preference synchronization and validation sync utilities for skrills"
license = "MIT"
repository = "https://github.com/athola/skrills"
homepage = "https://github.com/athola/skrills"
documentation = "https://athola.github.io/skrills/"
readme = "../../README.md"
keywords = ["mcp", "skills", "sync", "preferences", "config"]
categories = ["development-tools"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
sha2.workspace = true
hex = "0.4.3"
walkdir.workspace = true
dirs.workspace = true
tracing.workspace = true
skrills-snapshot = { path = "../snapshot", version = "0.9.1" }
skrills-validate = { path = "../validate", version = "0.9.1" }

[dev-dependencies]
serial_test = "4"
tempfile.workspace = true
serde_norway.workspace = true
mockall = "0.15"
tokio = { version = "1", features = ["full"] }
proptest = "1.4"
skrills-test-utils = { path = "../test-utils" }
